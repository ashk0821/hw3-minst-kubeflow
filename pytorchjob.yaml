apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: mnist-train
  namespace: mnist
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: present
            effect: NoSchedule
          nodeSelector:
            cloud.google.com/gke-accelerator: nvidia-tesla-t4
          containers:
          - name: pytorch
            image: us-central1-docker.pkg.dev/kubeflow-hw3/mnist-images/train:v1
            resources:
              limits:
                nvidia.com/gpu: 1
            volumeMounts:
            - name: model-vol
              mountPath: /mnt/model
          volumes:
          - name: model-vol
            persistentVolumeClaim:
              claimName: model-pvc
